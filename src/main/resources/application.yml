server:
  port: 8080
  servlet:
    context-path: /
  # atras do nginx/proxy reverso
  forward-headers-strategy: framework

spring:
  application:
    name: cadastro-fornecedores-produtos
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_DSN:192.168.254.252:1521/WINT}
    username: ${ORACLE_USER:PMC}
    password: ${ORACLE_PASSWORD:P3M5C0W1NT}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none          # as tabelas sao criadas pelo script database/01_schema.sql
    properties:
      hibernate:
        timezone.default_storage: NORMALIZE
        format_sql: true
    open-in-view: false
  mail:
    host: ${CFP_MAIL_HOST:}
    port: ${CFP_MAIL_PORT:587}
    username: ${CFP_MAIL_USUARIO:}
    password: ${CFP_MAIL_SENHA:}
    properties:
      mail:
        smtp:
          auth: ${CFP_MAIL_AUTH:true}
          # porta 465 = SSL direto (ssl.enable=true, starttls=false)
          # porta 587 = STARTTLS  (ssl.enable=false, starttls=true)
          ssl:
            enable: ${CFP_MAIL_SSL:false}
          starttls:
            enable: ${CFP_MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB

app:
  jwt:
    # Em producao defina a variavel de ambiente CFP_JWT_SECRET (minimo 32 caracteres)
    secret: ${CFP_JWT_SECRET:troque-esta-chave-por-uma-com-no-minimo-32-caracteres!!}
    expiracao-minutos: 480
  cors:
    origens: ${CFP_CORS_ORIGENS:http://localhost:5173}
  erp:
    # Tabela de fornecedores do WinThor lida em modo somente leitura.
    # Se o usuario PMC precisar de schema, use por exemplo: DBA.PCFORNEC
    tabela-fornecedor: ${CFP_ERP_TABELA_FORNECEDOR:PCFORNEC}
    tabela-produto: ${CFP_ERP_TABELA_PRODUTO:PCPRODUT}
    # departamento de piso e revestimento: quem tem produto nesse depto informa m2 no lugar de unidades
    codepto-piso: ${CFP_ERP_CODEPTO_PISO:13}
    # listas usadas no complemento WinThor (somente leitura)
    tabela-marca: ${CFP_ERP_TABELA_MARCA:PCMARCA}
    tabela-departamento: ${CFP_ERP_TABELA_DEPTO:PCDEPTO}
    tabela-secao: ${CFP_ERP_TABELA_SECAO:PCSECAO}
    # matricula do WinThor usada para carimbar o cadastro vindo do portal (etapa 2)
    matricula: ${CFP_ERP_MATRICULA:9}
    # bloqueia a aprovacao do pedido enquanto faltar o complemento WinThor de algum item
    exigir-complemento: ${CFP_ERP_EXIGIR_COMPLEMENTO:true}
    # true (padrao) = ja traz os campos do WinThor preenchidos com o que o fornecedor
    # enviou e com os padroes da casa; a analista confere e ajusta o que precisar.
    # false = bloco em branco, tudo digitado na mao.
    pre-preencher: ${CFP_ERP_PRE_PREENCHER:true}
    # conexao com o WinThor (leitura e gravacao). Em branco = usa a mesma do portal.
    datasource:
      dsn: ${CFP_ERP_DSN:}
      usuario: ${CFP_ERP_USER:}
      senha: ${CFP_ERP_PASSWORD:}
    integracao:
      # false = nao grava nada no WinThor (apenas prepara os dados)
      habilitada: ${CFP_ERP_INTEGRACAO:false}
      # numero da rotina gravado na PCTABPR
      rotina: ${CFP_ERP_ROTINA:203}
      # filial usada na PCPRODUT
      # PCPRODUT.CODFILIAL - 99 = produto valido para todas as filiais (padrao do WinThor)
      codfilial: ${CFP_ERP_CODFILIAL:99}
    # pedido de compra digitado pelo fornecedor -> sugestao para a rotina 220
    compra:
      # false (padrao) = aprova no portal, mas nao grava a sugestao no WinThor
      gerar-sugestao: ${CFP_ERP_SUGESTAO:true}
      # filiais que podem receber pedido (ex.: 1,2,6). Em branco = todas da PCFILIAL
      filiais: ${CFP_ERP_COMPRA_FILIAIS:}
      tabela-sugestao: ${CFP_ERP_TABELA_SUGESTAO:PCSUGESTAOCOMPRAC}
      tabela-sugestao-item: ${CFP_ERP_TABELA_SUGESTAO_ITEM:PCSUGESTAOCOMPRAI}
      # sequence do NUMSUGESTAO. Em branco = trava a tabela e usa MAX(NUMSUGESTAO) + 1.
      # NAO use DFSEQ_PCSUGESTAOCOMPRAC: ela esta em 3 e a tabela ja passa de 2.100.
      sequence-sugestao: ${CFP_ERP_SEQ_SUGESTAO:}
      # PCSUGESTAOCOMPRAI.STATUS do item gravado. P = pendente, como nascem as sugestoes
      # ainda nao processadas na base (a 220 troca para F ao gerar o pedido)
      status-item: ${CFP_ERP_SUGESTAO_STATUS_ITEM:P}
      # true = grava a quantidade tambem em QTPEDIDO. Na base, o pendente nasce com QTPEDIDO nulo
      preencher-qtpedido: ${CFP_ERP_SUGESTAO_QTPEDIDO:false}
      # TIPOEMBALAGEMPEDIDO - todas as sugestoes da base usam V. Em branco = padrao do fornecedor
      tipo-embalagem: ${CFP_ERP_SUGESTAO_TIPO_EMBALAGEM:V}
      # comparativo de precos: ultimas entradas (PCMOV, CODOPER = 'E')
      tabela-movimento: ${CFP_ERP_TABELA_MOVIMENTO:PCMOV}
      qtd-historico-precos: ${CFP_ERP_QTD_HISTORICO_PRECOS:5}
      # destaca o item quando o preco passa X% acima/abaixo da ultima compra
      alerta-percentual: ${CFP_ERP_ALERTA_PERCENTUAL:10}
  email:
    # so envia quando habilitado E com CFP_MAIL_HOST preenchido
    habilitado: ${CFP_MAIL_HABILITADO:false}
    remetente: ${CFP_MAIL_REMETENTE:nao-responda@grupopapa.com}
    nome-remetente: ${CFP_MAIL_NOME_REMETENTE:Portal do Fornecedor - Grupo Papa}
    copia-para: ${CFP_MAIL_COPIA:}
  portal:
    url: ${CFP_PORTAL_URL:http://localhost:5173}
  fotos:
    max-por-produto: ${CFP_FOTOS_MAX:5}
    max-mb: ${CFP_FOTOS_MAX_MB:5}
    # pasta em que o WinThor guarda as imagens dos produtos (\\192.168.254.252\winthor\FOTOS).
    # A pasta e montada no container (ver docker-compose) e o caminho de DENTRO do
    # container vai aqui. Em branco = nao copia nada, a foto fica so no banco.
    winthor:
      diretorio: ${CFP_FOTOS_WINTHOR_DIR:}
      # false = leva apenas a foto principal (CODPROD.jpg), que e a que o WinThor usa
      # true  = leva tambem as demais como CODPROD_2.jpg, CODPROD_3.jpg ...
      copiar-todas: ${CFP_FOTOS_WINTHOR_TODAS:false}
      # true = regrava por cima se ja existir um arquivo com o mesmo nome
      sobrescrever: ${CFP_FOTOS_WINTHOR_SOBRESCREVER:true}
  validacao:
    # true  = exige um GTIN real (confere o digito verificador do codigo de barras)
    # false = aceita qualquer numero com 8, 12, 13 ou 14 digitos (util para testes)
    gtin-digito-verificador: ${CFP_VALIDA_GTIN:true}

logging:
  level:
    br.com.grupopapa.cfp: INFO
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# expoe apenas o health, para o healthcheck do Docker
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
